<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="app-layout">

    <div class="container d-flex flex-column justify-content-center align-items-center"
         style="min-height: 60vh; margin-top: 80px;">

        <div class="text-center">
            <h1 class="display-4 fw-bold mb-3" style="color: var(--winx-text-dark);">
                Benvenuta, Anna!
            </h1>

            <p class="lead text-muted">
                Seleziona un'opzione dal menu a destra per iniziare
            </p>
        </div>

    </div>

    <nav class="navbar navbar-light fixed-top winx-topbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Dashboard Admin</a>

            <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasNavbar"
                    aria-controls="offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end winx-floating-menu" tabindex="-1" id="offcanvasNavbar"
                 aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"
                            aria-label="Chiudi"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" th:href="@{/dashboard_admin}">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/profilo}">Visualizza lista utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/rimuovi_utenti}">Rimuovi utenti scaduti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/statistiche_admin}">Statistiche</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
