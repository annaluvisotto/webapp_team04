<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="app-layout">


    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh;">

        <div class="container text-center" style="margin-top: 110px;">
            <h3 class="display-8 fw-bold mb-3" style="color: var(--zen-text-dark);">
                Qui puoi visualizzare il numero medio di allenamenti per i programmi predefiniti
            </h3>

            <div class="card overflow-hidden shadow-sm" style="transform: none; border: 2px solid var(--winx-accent);">
                <div style="position: relative; height: 450px; width: 100%;">
                <canvas id="adminStatsChart"></canvas>
            </div>
        </div>

        <script th:inline="javascript">
            const nomi = /*[[${nomi}]]*/ [];
            const datiBasic = /*[[${datiBasic}]]*/ [];
            const datiPro = /*[[${datiPro}]]*/ [];
            const rootStyles = getComputedStyle(document.documentElement);
            const coloreBasic = rootStyles.getPropertyValue('--winx-pastel-pink').trim();
            const colorePro = rootStyles.getPropertyValue('--winx-pastel-blue').trim();
            const grafico = document.getElementById('adminStatsChart').getContext('2d');

            new Chart(grafico, {
                type: 'bar',
                data: {
                    labels: nomi,
                    datasets: [
                        {
                            label: 'Media Utenti Basic',
                            data: datiBasic,
                            backgroundColor: coloreBasic,
                        },
                        {
                            label: 'Media Utenti Pro',
                            data: datiPro,
                            backgroundColor: colorePro,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            },
                            title: {
                                display: true,
                                text: 'Numero Medio di Esecuzioni'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Allenamenti'
                            }
                        }
                    }
                }
            });
        </script>

        <div th:replace="~{/fragments :: navbarAdmin}"></div>

        </div>
    </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
