<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<div class="d-flex flex-grow-1 align-items-start justify-content-center pt-4" style="margin-top: 70px;">

    <div class="cardlogin" style="width: 100%; max-width: 800px;">
        <div class="card-body p-4">

            <h3 class="card-title text-center mb-4 fw-bold">Cambia la tua password</h3>

            <p th:if="${errore}" th:text="${errore}" class="text-danger mt-2"></p>

            <form th:action="@{/gestione_cambiopw}" method="POST" id="cambiopw">

                <div class="mb-4">
                    <input type="password" class="form-control" id="oldPassword" placeholder="Password corrente" name="oldPassword" required>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Nuova password" name="newPassword" required>
                </div>
                <div id="errore-formato" class="text-danger mt-1 mb-3"></div>

                <div class="mb-3">
                    <input type="password" class="form-control" id="passwordRipetuta" placeholder="Ripeti nuova password" name="confirmPassword" required>
                </div>
                <div id="errore-conferma" class="text-danger mt-1 mb-3"></div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary w-50 mt-3">Conferma</button>
                </div>

            </form>

        </div>
    </div>

</div>

<!--cambia la navbar in base al ruolo-->
<th:block th:if="${authority == 'ROLE_USER_PROVA'}">
    <div th:replace="~{fragments :: navbarProva}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_BASIC'}">
    <div th:replace="~{fragments :: navbarBasic}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_PRO'}">
    <div th:replace="~{fragments :: navbarPro}"></div>
</th:block>

<div class="mt-auto w-100">
    <div th:replace="~{/fragments :: caroselloRecensioni}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/script.js}"> </script>

</body>
</html>
