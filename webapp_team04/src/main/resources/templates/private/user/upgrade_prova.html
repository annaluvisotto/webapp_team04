<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container mb-5" style="margin-top: 100px;">

    <div class="text-center mb-5">
        <h2>Seleziona un piano per effettuare l'upgrade</h2>
    </div>

    <form th:action="@{/gestione_upgrade}" method="post" class="needs-validation" id="upgradeForm" novalidate>

        <div class="row g-4 justify-content-center">

            <div class="col-12 col-md-4">
                <div class="card h-100 text-center piano-card card-sage-light" style="cursor: default; opacity: 0.85; border: 2px solid #7b9e76; overflow: hidden;">

                    <div style="background-color: #7b9e76; color: white; padding: 8px 0; font-weight: 600; font-size: 0.9rem;">
                        Il tuo piano attuale
                    </div>

                    <div class="card-header bg-transparent border-0 pt-3 pb-0">
                        <h4 class="my-0">Prova</h4>
                    </div>

                    <div class="card-body d-flex flex-column pt-2">
                        <h1 class="card-title">€0.00 <small class="text-muted fs-5">/ mese</small></h1>
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>Programmi di allenamento predefiniti</li>
                        </ul>
                    </div>

                </div>
            </div>

            <div class="col-12 col-md-4">
                <label class="w-100 h-100">
                    <input type="radio" name="ruolo" value="ROLE_USER_BASIC" class="piano-radio" required>

                    <div class="card h-100 text-center piano-card card-sage-mid">
                        <div class="card-header bg-transparent border-0 pt-4">
                            <h4 class="my-0">Basic</h4>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h1 class="card-title">€9.99 <small class="text-muted fs-5">/ mese</small></h1>
                            <ul class="list-unstyled mt-3 mb-4">
                                <li>Programmi di allenamento predefiniti</li>
                                <li>Statistiche di base</li>
                            </ul>
                        </div>
                    </div>
                </label>
            </div>

            <div class="col-12 col-md-4">
                <label class="w-100 h-100">
                    <input type="radio" name="ruolo" value="ROLE_USER_PRO" class="piano-radio" required>

                    <div class="card h-100 text-center piano-card card-sage-dark">
                        <div class="card-header bg-transparent border-0 pt-4">
                            <h4 class="my-0">Pro</h4>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h1 class="card-title">€19.99 <small class="text-muted fs-5">/ mese</small></h1>
                            <ul class="list-unstyled mt-3 mb-4">
                                <li>Programmi di allenamento predefiniti</li>
                                <li>Programmi personalizzati illimitati</li>
                                <li>Statistiche di base</li>
                                <li>Tracciamento kcal avanzato</li>
                            </ul>
                        </div>
                    </div>
                </label>
            </div>

            <div class="col-12 d-flex justify-content-center mt-5 mb-4">
                <button type="submit" class="btn btn-primary px-5 py-2 fs-5">Conferma</button>
            </div>

        </div>
    </form>
</div>

<div th:replace="~{fragments :: navbarProva}"></div>

<div class="mt-auto w-100">
    <div th:replace="~{fragments :: caroselloRecensioni}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/script.js}"> </script>
</body>
</html>
