<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Winx Fitness Club</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-light">

<div class="app-layout">

  <div class="container d-flex flex-column justify-content-center align-items-center"
       style="min-height: 60vh; margin-top: 80px;">

    <div class="text-center">
      <h1 class="display-4 fw-bold mb-3" style="color: var(--winx-text-dark);">
        Benvenuto/a, <span th:text="${nome}"></span> !
      </h1>

      <div class="card mt-5 w-100"
           style="max-width: 600px; border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div class="card-body p-4 text-start">

          <h4 class="fw-bold mb-4 text-center" style="color: var(--winx-text-dark);">
            Lasciaci un commento!
          </h4>

          <form id="formRecensione">

            <div class="mb-3">
              <label for="titoloRecensione" class="form-label fw-semibold">Titolo:</label>
              <input type="text" class="form-control" id="titoloRecensione" name="titolo"
                     placeholder="Dai un titolo al tuo commento..." required>
            </div>

            <div class="mb-3">
              <label for="testoRecensione" class="form-label fw-semibold">Testo:</label>
              <textarea class="form-control" id="testoRecensione" name="testo" rows="4"
                        placeholder="Raccontaci la tua esperienza..." required></textarea>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary px-5 py-2">Inserisci recensione</button>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>

  <div th:replace="~{/fragments :: navbarPro}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
