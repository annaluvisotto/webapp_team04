<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="d-flex flex-grow-1 align-items-center justify-content-center px-3" style="margin-top: 80px;">

    <div style="width: 100%; max-width: 600px;">

        <div class="card winx-profile-card">
            <div class="card-body text-center p-4">

                <div class="avatar-profile-container mb-2">
                    <svg width="70px" height="70px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"
                         class="winx-avatar-svg">
                        <g font-weight="400" font-family="Ubuntu" letter-spacing="0" word-spacing="0"
                           white-space="normal">
                            <path d="M8 2a2.84 2.84 0 0 0-1.12.221c-.345.141-.651.348-.906.615v.003l-.001.002c-.248.269-.44.592-.574.96-.137.367-.203.769-.203 1.2 0 .435.065.841.203 1.209.135.361.327.68.574.95l.001.002c.254.267.558.477.901.624v.003c.346.141.723.21 1.12.21.395 0 .77-.069 1.117-.21v-.002c.343-.147.644-.357.892-.625.255-.268.45-.59.586-.952.138-.368.204-.774.204-1.21h.01c0-.43-.065-.831-.203-1.198a2.771 2.771 0 0 0-.585-.963 2.5 2.5 0 0 0-.897-.618A2.835 2.835 0 0 0 7.999 2zM8.024 10.002c-2.317 0-3.561.213-4.486.91-.462.35-.767.825-.939 1.378-.172.553-.226.975-.228 1.71L8 14.002h5.629c-.001-.736-.052-1.159-.225-1.712-.172-.553-.477-1.027-.94-1.376-.923-.697-2.124-.912-4.44-.912z"/>
                        </g>
                    </svg>
                </div>

                <hr class="winx-divider my-2">

                <div class="row text-start mt-3">
                    <div class="col-6 mb-2">
                        <h6 class="text-muted mb-1" style="font-size: 0.85rem;">Nome</h6>
                        <p class="fw-bold mb-0" th:text="${nome}"></p>
                    </div>

                    <div class="col-6 mb-2">
                        <h6 class="text-muted mb-1" style="font-size: 0.85rem;">Cognome</h6>
                        <p class="fw-bold mb-0" th:text="${cognome}"></p>
                    </div>

                    <div class="col-6 mb-1">
                        <h6 class="text-muted mb-1" style="font-size: 0.85rem;">Data di nascita</h6>
                        <p class="fw-bold mb-0" th:text="${data_nascita}"></p>
                    </div>

                    <div class="col-6 mb-1">
                        <h6 class="text-muted mb-1" style="font-size: 0.85rem;">Ruolo</h6>
                        <p class="fw-bold mb-0" th:text="${ruolo}"></p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<th:block th:if="${authority == 'ROLE_USER_PROVA'}">
    <div th:replace="~{fragments :: navbarProva}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_BASIC'}">
    <div th:replace="~{fragments :: navbarBasic}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_PRO'}">
    <div th:replace="~{fragments :: navbarPro}"></div>
</th:block>

<div class="mt-auto w-100">
    <div th:replace="~{/fragments :: caroselloRecensioni}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
