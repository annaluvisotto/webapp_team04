<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-light">

<div class="app-layout">

    <div class="container d-flex flex-column justify-content-center align-items-center"
         style="min-height: 60vh; margin-top: 80px;">

        <div th:if="${messaggioSuccesso}" class="container mt-4">
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${messaggioSuccesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
            </div>
        </div>

        <div class="text-center w-100 mb-3">

            <h1 class="display-4 fw-bold" style="color: var(--winx-text-dark);">
                Benvenuto/a, <span th:text="${nome}"></span>!
            </h1>

            <h3 class="h5 fw-bold mb-0 mt-2" style="color: var(--winx-text-main);">
                Hai usufruito di <span class="winx-badge-counter" th:text="${esecuzioni}"></span>/3 allenamenti gratuiti
            </h3>

        </div>

        <div class="container w-100">
            <div class="row align-items-center justify-content-center g-4">

                <div class="col-12 col-lg-6">
                    <div class="card w-100 h-100" style="border-radius: 15px; border: 2px dashed var(--winx-accent); box-shadow: 6px 6px 0px rgba(176, 224, 230, 0.4); background-color: var(--winx-card);">
                        <div class="card-body p-4 text-start">

                            <h4 class="fw-bold mb-4 text-center" style="color: var(--winx-text-dark);">
                                Lasciaci un commento!
                            </h4>

                            <div th:replace="~{/fragments :: formRecensione}"></div>

                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div th:replace="~{/fragments :: caroselloRecensioni}"></div>
                </div>

            </div>
        </div>

    </div>

    <div th:replace="~{/fragments :: navbarProva}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
