<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-light">

<div class="app-layout">

    <div class="container d-flex flex-column justify-content-center align-items-center"
         style="min-height: 60vh; margin-top: 80px;">

        <div class="text-center">
            <h1 class="display-4 fw-bold mb-3" style="color: var(--winx-text-dark);">
                Benvenuto/a, <span th:text="${nome}"></span> !
            </h1>

            <h3 class="h5 fw-bold mb-4" style="color: var(--winx-text-main);">
                Hai usufruito di <span class="winx-badge-counter">2/3</span> allenamenti gratuiti
            </h3>

            <p class="lead text-muted">
                Seleziona un'opzione dal menu a destra per iniziare
            </p>
        </div>

    </div>

    <div th:replace="~{/fragments :: navbarProva}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
