<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-light">

<div class="d-flex align-items-center justify-content-center vh-100">

    <div class="col-md-10 col-lg-8">

        <div class="container text-center" style="margin-top: 110px;">
            <h3 class="display-8 fw-bold mb-3" style="color: var(--winx-text-main);">
                Programmi di allenamento
            </h3>
            <p class="text-muted">Seleziona un programma per visualizzarne i dettagli ed eseguirlo.</p>
        </div>

        <div class="row row-cols-3 g-5 mb-5">
            <div class="col" th:each="prog : ${defaultTrainings}">
                <div class="accordion shadow-sm" th:id="'DefContainer' + ${prog.id}">
                    <div class="accordion-item" style="border: 2px solid var(--winx-accent); border-radius: 10px; overflow: hidden;">

                        <h2 class="accordion-header" th:id="'DefHead' + ${prog.id}">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" th:data-bs-target="'#DefBody' + ${prog.id}" aria-expanded="false" th:aria-controls="'DefBody' + ${prog.id}" style="color: var(--winx-text-main);">
                                <span th:text="${prog.nome}">Nome Allenamento</span>
                            </button>
                        </h2>

                        <div th:id="'DefBody' + ${prog.id}" class="accordion-collapse collapse show" th:aria-labelledby="'DefHead' + ${prog.id}">
                            <div class="accordion-body bg-light">
                                <div class="table-responsive mb-3">
                                    <table class="table table-sm table-striped table-bordered align-middle text-center bg-white m-0">
                                        <thead class="table-dark">
                                        <tr>
                                            <th scope="col" class="text-start">Esercizio</th>
                                            <th scope="col">Serie</th>
                                            <th scope="col">Ripetizioni</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="es : ${prog.es}">
                                            <td class="text-start" th:text="${es.nome}">Nome esercizio</td>
                                            <td th:text="${es.serie}">Numero serie</td>
                                            <td th:text="${es.ripetizioni}">Numero ripetizioni</td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <span class="text-secondary small fw-bold">
                                    <span th:text="${prog.kcal}">Kcal</span> kcal
                                </span>

                                <div class="d-flex justify-content-end pt-2 border-top">
                                    <form th:action="@{/training/completed}" method="post" class="training-sub">
                                        <input type="hidden" name="id" th:value="${prog.id}">
                                        <input type="hidden" name="tipo" value="DEFAULT">
                                        <button type="submit" class="btn btn-success px-3">
                                            Completato
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col" th:each="prog : ${personalizedTrainings}">
                <div class="accordion shadow-sm" th:id="'PersContainer' + ${prog.id}">
                    <div class="accordion-item" style="border: 2px solid var(--winx-accent); border-radius: 10px; overflow: hidden;">

                        <h2 class="accordion-header" th:id="'PersHead' + ${prog.id}">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" th:data-bs-target="'#PersBody' + ${prog.id}" aria-expanded="false" th:aria-controls="'PersBody' + ${prog.id}" style="color: var(--winx-text-main);">
                                <span th:text="${prog.nome}">Nome Allenamento</span>
                            </button>
                        </h2>

                        <div th:id="'PersBody' + ${prog.id}" class="accordion-collapse collapse show" th:aria-labelledby="'PersHead' + ${prog.id}">
                            <div class="accordion-body bg-light">
                                <div class="table-responsive mb-3">
                                    <table class="table table-sm table-striped table-bordered align-middle text-center bg-white m-0">
                                        <thead class="table-dark">
                                        <tr>
                                            <th scope="col" class="text-start">Esercizio</th>
                                            <th scope="col">Serie</th>
                                            <th scope="col">Ripetizioni</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="es : ${prog.es}">
                                            <td class="text-start" th:text="${es.nome}">Nome esercizio</td>
                                            <td th:text="${es.serie}">Numero serie</td>
                                            <td th:text="${es.ripetizioni}">Numero ripetizioni</td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <span class="text-secondary small fw-bold">
                                    <span th:text="${prog.kcal}">Kcal</span> kcal
                                </span>

                                <div class="d-flex justify-content-end pt-2 border-top">
                                    <form th:action="@{/training/completed}" method="post" class="training-sub">
                                        <input type="hidden" name="id" th:value="${prog.id}">
                                        <input type="hidden" name="tipo" value="PERSONALIZED">
                                        <button type="submit" class="btn btn-success px-3">
                                            Completato
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const userRole = /*[[${authority}]]*/ '';
    const execPrec = /*[[${totaleEsecuzioni}]]*/ 0;

    document.querySelectorAll('.training-sub').forEach(form => {
        form.addEventListener('submit', function(event) {
            if (userRole === 'ROLE_USER_PROVA' && execPrec === 2) {
                alert("Hai completato 3/3 allenamenti. Questo account non è più valido");
            }
        });
    });
    /*]]>*/
</script>

<th:block th:if="${authority == 'ROLE_USER_PROVA'}">
    <div th:replace="~{fragments :: navbarProva}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_BASIC'}">
    <div th:replace="~{fragments :: navbarBasic}"></div>
</th:block>

<th:block th:if="${authority == 'ROLE_USER_PRO'}">
    <div th:replace="~{fragments :: navbarPro}"></div>
</th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
