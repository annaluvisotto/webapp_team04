<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx Fitness Club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="app-layout">

    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh; margin-top: 80px;">

        <div class="text-center">
            <h3 class="display-8 fw-bold mb-3" style="color: var(--winx-text-dark);">
                Qui puoi visualizzare il numero medio di allenamenti per ogni programma
            </h3>

        </div>

        <div class="card overflow-hidden shadow-sm" style="transform: none; border: 2px solid var(--winx-accent);">
            <div class="table-responsive">
                <h4 class="text-center mb-4">Frequenza Allenamenti</h4>
            <div style="position: relative; height: 500px; width: 100%;">
                <canvas id="istogrammaFrequenze"></canvas> <!-- serve lo script javascript per inserire il contenuto dell'istogramma -->
            </div>
        </div>

    </div>

        <!--cambia la navbar in base al ruolo-->
        <th:block th:if="${authority == 'ROLE_USER_BASIC'}">
            <div th:replace="~{fragments :: navbarBasic}"></div>
        </th:block>

        <th:block th:if="${authority == 'ROLE_USER_PRO'}">
            <div th:replace="~{fragments :: navbarPro}"></div>
        </th:block>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
