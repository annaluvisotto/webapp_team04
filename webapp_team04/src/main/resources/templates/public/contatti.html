<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Winx fitness club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="d-flex align-items-center justify-content-center flex-grow-1">
    <div class="card" style="width: 100%; max-width: 600px;">
        <div class="card-body p-4">

            <h3 class="card-title text-center mb-4 fw-bold">Contattaci</h3>

            <!--Da cambiare con action di timeleaf (alla dashboard corrispondente) e method post-->
            <form id="form-contatti">
                <div class="mb-4">
                    <input type="text" class="form-control" id="uname" placeholder="Nome Completo" name="uname"
                           required>
                </div>

                <div class="mb-4">
                    <input type="text" class="form-control" id="mail" placeholder="Email" name="mail" required>
                </div>

                <div class="mb-4">
                    <textarea type="text" class="form-control" id="message" placeholder="Il tuo messaggio"
                              name="message" rows=3 required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Invia</button>
            </form>

            <div id="messaggio-conferma" class="alert alert-success d-none mt-3" ruolo="alert">Grazie! Il tuo messaggio
                è stato inviato con successo.
            </div>

        </div>
    </div>

</div>

<div class="mt-auto w-100">
    <div th:replace="~{/fragments :: caroselloRecensioni}"></div>
</div>

<script>
    document.getElementById('form-contatti').addEventListener('submit', function (event) {
        event.preventDefault();
        // Rende visibile il messaggio di corretto invio rimuovendo la classe d-none
        document.getElementById('messaggio-conferma').classList.remove('d-none');
        this.reset();
    });
</script>

</body>
</html>
