<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Winx fitness club</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css?v=4.0}">
</head>
<body>

<div class="container mt-3">
    <h2 class="text-center mb-4">Sign up</h2>
    <h4>Crea il tuo account</h4>

    <p class="text-muted">I campi contrassegnati da <span class="text-danger">*</span> sono obbligatori</p>

    <form th:action="@{/adduser}" method="POST" id="signup">

        <p th:if="${errore}" th:text="${errore}" class="text-danger mt-2"></p>

        <div class="mb-3 mt-3">
            <label for="nome" class="form-label">Nome: <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nome" placeholder="Inserisci il tuo nome" name="nome" required>
        </div>

        <div class="mb-3 mt-3">
            <label for="cognome" class="form-label">Cognome: <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="cognome" placeholder="Inserisci il tuo cognome" name="cognome" required>
        </div>

        <div class="mb-3 mt-3">
            <label for="data" class="form-label">Data di nascita: <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="data" placeholder="Inserisci la tua data di nascita (GG/MM/AAAA)" name="data" required>
        </div>
        <div id="errore-data" class="text-danger mt-1 mb-3"></div>

        <div class="mb-3 mt-3">
            <label for="email" class="form-label">Email: <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="email" placeholder="Inserisci una mail" name="email" required>
        </div>

        <div class="mb-3 mt-3">
            <label for="username" class="form-label">Username: <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="username" placeholder="Inserisci uno username" name="username" required>
        </div>

        <div class="mb-3 mt-3">
            <label for="password" class="form-label">Password: <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="password" placeholder="Inserisci una password" name="password" required>
        </div>
        <div id="errore-formato" class="text-danger mt-1 mb-3"></div>

        <div class="mb-3">
            <label for="passwordRipetuta" class="form-label">Ripetere la password: <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="passwordRipetuta" placeholder="Inserisci una password" name="passwordRipetuta" required>
        </div>
        <div id="errore-conferma" class="text-danger mt-1 mb-3"></div>

        <div class="container my-5">
            <h4>Scegli il tuo piano di allenamento</h4>

            <div class="text-danger"></div>

            <div class="row g-4 justify-content-center">

                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="radio" name="ruolo" value="ROLE_USER_PROVA" class="piano-radio" required>

                        <div class="card h-100 text-center piano-card card-sage-light">
                            <div class="card-header bg-transparent border-0 pt-4">
                                <h4 class="my-0">Prova</h4>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h1 class="card-title">€0.00 <small class="text-muted fs-5">/ mese</small></h1>
                                <ul class="list-unstyled mt-3 mb-4">
                                    <li>Programmi di allenamento predefiniti</li>
                                </ul>
                                <div class="mt-auto">

                                </div>
                            </div>
                        </div>
                    </label>
                </div>

                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="radio" name="ruolo" value="ROLE_USER_BASIC" class="piano-radio" required>

                        <div class="card h-100 text-center piano-card card-sage-mid">
                            <div class="card-header bg-transparent border-0 pt-4">
                                <h4 class="my-0">Basic</h4>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h1 class="card-title">€9.99 <small class="text-muted fs-5">/ mese</small></h1>
                                <ul class="list-unstyled mt-3 mb-4">
                                    <li>Programmi di allenamento predefiniti</li>
                                    <li>Statistiche di base</li>
                                </ul>
                                <div class="mt-auto">

                                </div>
                            </div>
                        </div>
                    </label>
                </div>

                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="radio" name="ruolo" value="ROLE_USER_PRO" class="piano-radio" required>

                        <div class="card h-100 text-center piano-card card-sage-mid">
                            <div class="card-header bg-transparent border-0 pt-4">
                                <h4 class="my-0">Pro</h4>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h1 class="card-title">€19.99 <small class="text-muted fs-5">/ mese</small></h1>
                                <ul class="list-unstyled mt-3 mb-4">
                                    <li>Programmi di allenamento predefiniti</li>
                                    <li>Programmi personalizzati illimitati</li>
                                    <li>Statistiche di base</li>
                                    <li>Tracciamento kcal avanzato</li>
                                </ul>
                            </div>
                        </div>

                    </label>

                </div>

                <div class="d-flex justify-content-between mt-4">
                    <div>
                        <button type="submit" class="btn btn-primary" id="reg">Registrati</button>
                    </div>

                    <div>
                        <button type="reset" class="btn btn-primary" id="res">Reset</button>
                    </div>
                </div>
            </div>
        </div>

    </form>
</div>

<script th:src="@{/script.js}"> </script>

<div th:replace="~{/fragments :: caroselloRecensioni}"></div>
<script th:src="@{/script.js}"> </script>
</body>
</html>
